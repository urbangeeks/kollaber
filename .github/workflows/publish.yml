name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SELF_HOSTED=true
          tags: |
            ghcr.io/urbangeeks/kollaber-api:latest
            ghcr.io/urbangeeks/kollaber-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Package and push Helm charts
        run: |
          helm package charts/kollaber charts/kube-watcher --destination /tmp/charts
          for chart in /tmp/charts/*.tgz; do
            helm push "$chart" oci://ghcr.io/urbangeeks/charts
          done
