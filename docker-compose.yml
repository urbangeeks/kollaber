services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: kollaber
      POSTGRES_USER: kollaber
      POSTGRES_PASSWORD: kollaber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollaber"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
