# https://taskfile.dev
version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run backend with hot reload (air)
    cmds:
      - air

  ui:dev:
    desc: Run frontend dev server
    dir: ui
    cmds:
      - npm run dev

  start:
    desc: Start backend and frontend dev servers in parallel
    deps: [dev, ui:dev]

  build:ui:
    desc: Build frontend static export into ui/dist
    dir: ui
    cmds:
      - npm run build

  build:
    desc: Compile single-binary server (embeds frontend)
    deps: [build:ui]
    cmds:
      - cmd: go build -o ./tmp/server.exe ./cmd/app
        platforms: [windows]
      - cmd: go build -o ./tmp/server ./cmd/app
        platforms: [linux, darwin]

  build:cli:
    desc: Compile kollaber CLI binary
    cmds:
      - cmd: go build -o ./tmp/kollaber.exe ./cmd/kollaber
        platforms: [windows]
      - cmd: go build -o ./tmp/kollaber ./cmd/kollaber
        platforms: [linux, darwin]

  install:cli:
    desc: Install kollaber CLI to GOPATH/bin
    cmds:
      - go install ./cmd/kollaber

  run:
    desc: Build full binary (UI + server) and run it
    deps: [build]
    cmds:
      - cmd: ./tmp/server.exe
        platforms: [windows]
      - cmd: ./tmp/server
        platforms: [linux, darwin]

  db:up:
    desc: Start PostgreSQL container
    cmds:
      - docker run -d
          --name kollaber-db
          --replace
          -e POSTGRES_DB=kollaber
          -e POSTGRES_USER=kollaber
          -e POSTGRES_PASSWORD=kollaber
          -p 5432:5432
          -v kollaber-pgdata:/var/lib/postgresql/data
          postgres:16-alpine

  db:down:
    desc: Stop and remove PostgreSQL container
    cmds:
      - docker stop kollaber-db || true
      - docker rm kollaber-db || true

  db:reset:
    desc: Wipe volume and restart PostgreSQL
    cmds:
      - task: db:down
      - docker volume rm kollaber-pgdata || true
      - task: db:up

  db:logs:
    desc: Tail PostgreSQL logs
    cmds:
      - docker logs -f kollaber-db

  migrate:
    desc: Run migrations via the app binary (MIGRATE_ONLY mode)
    deps: [build]
    cmds:
      - cmd: MIGRATE_ONLY=true ./tmp/server.exe
        platforms: [windows]
      - cmd: MIGRATE_ONLY=true ./tmp/server
        platforms: [linux, darwin]

  generate:
    desc: Run sqlc code generation
    cmds:
      - sqlc generate

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
