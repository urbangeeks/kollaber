version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/001_init.sql"
      - "migrations/003_event_status.sql"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
