## Kollaber Helm Chart Values
## Ref: https://github.com/urbangeeks/kollaber

# -- Number of API replicas
replicaCount: 1

image:
  repository: ghcr.io/urbangeeks/kollaber-api
  tag: latest
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

api:
  port: 8080
  resources: {}
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 256Mi

# -- External-facing URLs
urls:
  # Public URL of the API (accessed by users' browsers)
  api: http://localhost:8080
  # Public URL of the frontend
  frontend: http://localhost:3000

# Weekly digest email. Sent on Monday to members who opted in under
# Settings → Notifications. Safe to run with more than one replica: the send is
# claimed in the database, so exactly one pod mails each org.
digest:
  # Set true to send no digests at all
  disabled: false
  # UTC hour on Monday at which digests go out (0-23)
  sendHour: 14

# -- Secret values — provide via --set or an external secret manager
secret:
  # JWT signing secret — required, generate with: openssl rand -hex 32
  jwtSecret: ""
  # GitHub OAuth credentials (optional — disables GitHub login if unset)
  githubClientId: ""
  githubClientSecret: ""
  # Webhook HMAC secret (optional — disables signature verification if unset)
  webhookSecret: ""
  # SMTP credentials (optional — disables email notifications if unset)
  smtpHost: ""
  smtpPort: "587"
  smtpUser: ""
  smtpPassword: ""
  # Anthropic API key (optional — AI summaries, postmortems, and the timeline
  # assistant return an error if unset; the rest of the app works normally)
  anthropicApiKey: ""

# -- PostgreSQL connection string (REQUIRED).
# The chart does not bundle a database — point this at any reachable Postgres
# (a managed instance, or one you deploy in-cluster such as a Bitnami
# postgresql release). Install fails fast with a helpful message if unset.
# Example: postgres://user:pass@my-rds-host:5432/kollaber
externalDatabaseUrl: ""

# -- GitHub OAuth redirect URL (optional)
githubRedirectUrl: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #
  # Single host routing both API (/api/*) and UI (/*):
  host: kollaber.example.com
  tls: []
  # tls:
  #   - secretName: kollaber-tls
  #     hosts:
  #       - kollaber.example.com

# -- Istio Gateway + VirtualService (use instead of ingress for Istio service mesh)
istio:
  enabled: false
  # Label selector for the Istio ingress gateway pod
  gatewaySelector:
    istio: ingressgateway
  host: kollaber.example.com
  # Optional TLS — requires a credential (cert) in the istio-system namespace
  tls: {}
  # tls:
  #   mode: SIMPLE
  #   credentialName: kollaber-tls

# -- Migration job runs before every install/upgrade
migrate:
  enabled: true
