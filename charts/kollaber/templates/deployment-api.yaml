apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kollaber.fullname" . }}-api
  labels:
    {{- include "kollaber.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kollaber.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kollaber.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.urls.frontend | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.urls.frontend | quote }}
            - name: GITHUB_REDIRECT_URL
              value: {{ .Values.githubRedirectUrl | default (printf "%s/auth/github/callback" .Values.urls.api) | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: jwt-secret
            - name: DATABASE_URL
              value: {{ include "kollaber.databaseUrl" . | quote }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: github-client-secret
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: webhook-secret
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: smtp-host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: smtp-port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: smtp-user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: smtp-password
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: anthropic-api-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
