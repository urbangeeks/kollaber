{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kollaber.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "kollaber.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
        {{- include "kollaber.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          env:
            - name: MIGRATE_ONLY
              value: "true"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: db-password
            - name: DATABASE_URL
              {{- if .Values.externalDatabaseUrl }}
              value: {{ .Values.externalDatabaseUrl | quote }}
              {{- else }}
              value: "postgres://kollaber:$(DB_PASSWORD)@{{ include "kollaber.fullname" . }}-postgres:5432/kollaber"
              {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kollaber.fullname" . }}
                  key: jwt-secret
{{- end }}
