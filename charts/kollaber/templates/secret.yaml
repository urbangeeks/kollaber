apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kollaber.fullname" . }}
  labels:
    {{- include "kollaber.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  jwt-secret: {{ .Values.secret.jwtSecret | required "secret.jwtSecret is required" | quote }}
  github-client-id: {{ .Values.secret.githubClientId | quote }}
  github-client-secret: {{ .Values.secret.githubClientSecret | quote }}
  webhook-secret: {{ .Values.secret.webhookSecret | quote }}
  smtp-host: {{ .Values.secret.smtpHost | quote }}
  smtp-port: {{ .Values.secret.smtpPort | quote }}
  smtp-user: {{ .Values.secret.smtpUser | quote }}
  smtp-password: {{ .Values.secret.smtpPassword | quote }}
  anthropic-api-key: {{ .Values.secret.anthropicApiKey | quote }}
